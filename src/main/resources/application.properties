# Application name
spring.application.name=thinkhumble

# Use Render's PORT environment variable (defaults to 8080 locally)
server.port=${PORT:8080}

# Alpha Vantage API
alpha.vantage.api.url=https://www.alphavantage.co/query
alpha.vantage.api.key=${ALPHA_VANTAGE_API_KEY}

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# MongoDB (use full URI as env variable)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=thinkhumble

# Swagger Docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html